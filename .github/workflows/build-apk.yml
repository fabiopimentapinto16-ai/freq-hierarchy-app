name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - run: python -m unittest discover -s tests -t .

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Testes Kotlin (mesmos vetores do Python)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build do APK (debug)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: freq-hierarchy-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publicar APK na Release (link de download direto)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FreqHierarchy-debug.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest FreqHierarchy-debug.apk --prerelease \
            --title "APK de teste (debug) - ${GITHUB_SHA::7}" \
            --notes "Build automatico do commit ${GITHUB_SHA}. APK de depuracao: instale permitindo 'fontes desconhecidas'."
